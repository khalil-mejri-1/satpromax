  <style>
    /* Professional Pre-loader CSS */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .loader-content {
      text-align: center;
      animation: fadeInScale 0.8s ease-out;
    }

    .loader-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    .progress-container {
      width: 240px;
      height: 6px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 10px;
      animation: progressAnim 2.5s infinite ease-in-out;
    }

    .loader-text {
      margin-top: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    @keyframes fadeInScale {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes progressAnim {
      0% { width: 0%; left: 0; }
      50% { width: 100%; left: 0; }
      100% { width: 0%; left: 100%; }
    }

    .preloader-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>

<body>
  <!-- Pre-loader HTML -->
  <div id="preloader">
    <div class="loader-content">

      <div class="loader-text">Chargement en cours...</div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Remove preloader function
    const hidePreloader = () => {
      const loader = document.getElementById('preloader');
      if (loader && !loader.classList.contains('preloader-hidden')) {
        loader.classList.add('preloader-hidden');
        setTimeout(() => {
          loader.remove();
        }, 400);
      }
    };

    // Remove preloader after page is fully loaded
    window.addEventListener('load', function() {
      setTimeout(hidePreloader, 300); // Small delay for smooth feel
    });

    // Fallback: Max 1.1 seconds wait + 0.4s transition = 1.5 seconds total
    setTimeout(hidePreloader, 1100);
  </script>
